======================================================================
/etc/resolv.conf
----------------------------------------------------------------------
1. OVERVIEW
======================================================================
The /etc/resolv.conf file is the primary configuration file for the C 
library resolver routine in Unix-like operating systems. Note that the 
correct file name is "resolv.conf" (without an 'e' before .conf).

It specifies which Domain Name System (DNS) recursive servers to query, 
defines default search domains for short hostname lookups, and sets 
operational resolver options (timeouts, retries, etc.).

======================================================================
2. SYNTAX STRUCTURE & KEY DIRECTIVES
======================================================================
The file consists of directive keywords followed by values. Lines starting 
with '#' or ';' are treated as comments.

Key Directives:

* nameserver <IP_Address>
  Specifies the IPv4 or IPv6 address of a DNS server to query. 
  - Up to 3 nameserver entries can be listed.
  - Queried in sequential order (first to last) unless 'rotate' option is set.

* search <domain_1> [domain_2 ...]
  Defines a search list of up to 6 local domain names used for short-name 
  lookups (e.g., querying 'server1' auto-appends '.internal.example.com').

* domain <domain_name>
  Sets a single local domain name. (Obsolete; replaced by 'search', but 
  retained for backward compatibility. If both are present, last entry wins).

* options <option_1> [option_2 ...]
  Customizes DNS resolver behavior:
  - timeout:n   Set timeout in seconds before trying the next nameserver (default: 5).
  - attempts:n  Set query attempts to DNS servers before giving up (default: 2).
  - rotate      Distribute query load by round-robing nameservers listed.
  - ndots:n     Sets minimum number of dots in a hostname required before 
                an absolute query is performed (default: 1).

======================================================================
3. STANDARD CONFIGURATION EXAMPLES
======================================================================

--- Standard Static Server Configuration ---
nameserver 1.1.1.1
nameserver 8.8.8.8
search corp.example.com internal.net
options timeout:2 attempts:3 rotate

--- Local Caching / Stub Resolver Setup (e.g., systemd-resolved) ---
nameserver 127.0.0.53
options edns0 trust-ad
search localdomain

======================================================================
4. PRACTICAL SYSTEM ADMINISTRATION USE CASES
======================================================================

A. Fast-Failing Secondary DNS Failover
---------------------------------------
By default, glibc resolver waits 5 seconds before trying a secondary DNS server. 
In enterprise production setups, lower timeouts prevent long application delays:

nameserver 10.0.0.10
nameserver 10.0.0.11
options timeout:1 attempts:2

B. Internal Domain Search Automation
------------------------------------
Allow administrators and apps to resolve internal services via short names 
('db1' -> 'db1.prod.internal'):

search prod.internal dev.internal corp.company.local
nameserver 10.0.0.1

======================================================================
5. MODERN LINUX ARCHITECTURE & MANAGEMENT
======================================================================
On modern Linux distributions, /etc/resolv.conf is often auto-generated 
and managed dynamically by network orchestration services. Direct manual 
edits may be overwritten on reboot or network restart.

Common Managers:
1. systemd-resolved:
   /etc/resolv.conf is typically a symlink pointing to:
   /run/systemd/resolve/stub-resolv.conf
   Configuration managed via: /etc/systemd/resolved.conf

2. NetworkManager:
   Dynamically generates resolv.conf based on DHCP network interface configurations.
   Configuration overrides set in: /etc/NetworkManager/NetworkManager.conf

3. resolvconf / openresolv:
   Frame-work for managing multiple DNS sources dynamically.

======================================================================
6. OPERATIONAL COMMANDS & TROUBLESHOOTING
======================================================================

Testing DNS Resolution:
-----------------------
* Query DNS using 'dig' (Domain Information Groper):
  dig example.com

* Query using specific server declared in resolv.conf:
  dig @1.1.1.1 example.com

* Perform reverse lookup:
  dig -x 192.168.1.1

* Legacy lookup tool:
  nslookup example.com

Flushing DNS Resolver Cache:
----------------------------
* systemd-resolved:
  sudo resolvectl flush-caches

* Check current active DNS server (systemd):
  resolvectl status

======================================================================
7. SECURITY & OPERATIONAL BEST PRACTICES
======================================================================
1. File Integrity: Verify if /etc/resolv.conf is a symlink or static file 
   before editing manually (`ls -l /etc/resolv.conf`).
2. Limit Search Domains: Keep search domains to a minimum (1-3 max). Excess 
   search entries increase DNS traffic and slow down lookup resolution times.
3. Lock Configuration: If preventing automatic dynamic updates on static setups:
   sudo chattr +i /etc/resolv.conf  (Applies immutable attribute)
