===============================================================================
 /etc/sestatus.conf FILE
===============================================================================

1. INTRODUCTION & OVERVIEW
-------------------------------------------------------------------------------
The `/etc/sestatus.conf` configuration file controls the output and behavior 
of the `sestatus` (SELinux Status) utility on Security-Enhanced Linux (SELinux) 
enabled systems (such as RHEL, CentOS, Fedora, and Rocky Linux).

While SELinux policies control security rules, `/etc/sestatus.conf` tells 
the `sestatus` co	1mmand which specific files, directories, and processes to 
monitor and display when checking system status.


2. FILE LOCATION AND PERMISSIONS
-------------------------------------------------------------------------------
* File Path: /etc/sestatus.conf
* Owner: root:root
* Default Permissions: 644 (-rw-r--r--)


3. STRUCTURE AND SECTIONS OF /etc/sestatus.conf
-------------------------------------------------------------------------------
The configuration file is divided into two main sections: `[files]` and `[process]`.

A. The [files] Section
----------------------
Lists full path references to critical files or directories whose SELinux 
security context (labels) should be checked and displayed when running `sestatus -v`.

Example entries:
  [files]
  /etc/passwd
  /etc/shadow
  /etc/gshadow
  /etc/sudoers
  /usr/bin/login

B. The [process] Section
------------------------
Lists binary paths for key system processes whose active running SELinux 
context should be inspected when executing `sestatus -v`.

Example entries:
  [process]
  /sbin/init
  /usr/sbin/sshd
  /usr/sbin/httpd


4. RELATED COMMANDS & USAGE
-------------------------------------------------------------------------------
A. Display Basic SELinux Status:
   sestatus

   Sample Output:
     SELinux status:                 enabled
     SELinuxfs mount:                /sys/fs/selinux
     SELinux root directory:         /etc/selinux
     Loaded policy name:             targeted
     Current mode:                   enforcing
     Mode from config file:          enforcing
     Policy MLS status:              enabled
     Policy deny_unknown status:     allowed
     Memory protection checking:     actual (secure)
     Max kernel policy version:      33

B. Display Verbose Status (Uses /etc/sestatus.conf):
   sestatus -v

   Sample Verbose Output:
     Process contexts:
     /sbin/init                      system_u:system_r:init_t:s0
     /usr/sbin/sshd                  system_u:system_r:sshd_t:s0

     File contexts:
     /etc/passwd                     system_u:object_r:passwd_file_t:s0
     /etc/shadow                     system_u:object_r:shadow_t:s0


5. BEST PRACTICES & CUSTOMIZATION
-------------------------------------------------------------------------------
1. Monitoring Custom Applications: Add custom web server binaries, database 
   executables, or sensitive configuration files to `/etc/sestatus.conf` to 
   quickly audit their SELinux contexts using `sestatus -v`.
2. Do Not Remove System Defaults: Keep core system files (like `/etc/passwd` 
   and `/sbin/init`) listed in the configuration file for baseline security audits.
3. Syntax Precision: Always specify absolute paths for entries under both 
   `[files]` and `[process]` sections.
