================================================================================
LINUX CHRONY CONFIGURATION GUIDE (/etc/chrony.conf)
================================================================================

1. WHY /ETC/CHRONY.CONF EXISTS AND HOW IT WORKS
--------------------------------------------------------------------------------
- Why it exists: 
  The `/etc/chrony.conf` file is the master configuration file for 'chronyd', 
  the default Network Time Protocol (NTP) daemon used in modern Linux distributions 
  (such as RHEL, CentOS, Fedora, Ubuntu, and Debian). It centralizes all settings 
  related to how a computer synchronizes its internal clock.

- How it works:
  When the chrony service boots up, it reads this file to determine:
  1. Time Sources: Which external servers or pools to query for accurate time.
  2. Clock Adjustment: Whether to adjust time gradually (slewing) or jump it 
     immediately (stepping) when drift is detected.
  3. Hardware Sync: How to coordinate time between the kernel software and the 
     hardware real-time clock (RTC).
  4. Access Control: Which local network clients are allowed to use this machine 
     as their NTP server.


2. STANDARD /ETC/CHRONY.CONF TEMPLATE
--------------------------------------------------------------------------------
# /etc/chrony.conf - Main configuration file for chronyd

# Use public servers from the pool.ntp.org project with 'iburst' for fast sync
pool pool.ntp.org iburst

# Record the rate at which the system clock gains/loses time
driftfile /var/lib/chrony/drift

# Step the system clock if the offset is larger than 1 second, 
# but only in the first 3 updates after boot
makestep 1.0 3

# Enable kernel synchronization of the hardware real-time clock (RTC)
rtcsync

# Specify directory for log files
logdir /var/log/chrony


3. EXPLANATION OF KEY ENTRIES & HOW TO WRITE THEM
--------------------------------------------------------------------------------
- pool / server:
  * Syntax: `pool <hostname> iburst` or `server <IP/domain> iburst`
  * Explanation: Defines upstream time sources. The `iburst` option sends a 
    burst of four packets instead of one during initial startup, dramatically 
    reducing synchronization time.

- driftfile:
  * Syntax: `driftfile <path-to-file>`
  * Explanation: Stores the system clock's calibration data (how fast or slow 
    the hardware crystal runs). This allows chrony to keep accurate time even 
    when disconnected from the internet or after a reboot.

- makestep:
  * Syntax: `makestep <threshold-in-seconds> <update-count>`
  * Explanation: Normally, chrony speeds up or slows down the clock gradually 
    to avoid breaking applications sensitive to time jumps. If the clock is off 
    by hours, however, `makestep 1.0 3` forces an immediate jump for the first 
    3 updates.

- rtcsync:
  * Syntax: `rtcsync`
  * Explanation: Tells the kernel to periodically copy the synchronized system 
    time back to the motherboard's hardware CMOS clock every 11 minutes.

