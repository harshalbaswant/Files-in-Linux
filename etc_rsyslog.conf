===============================================================================
       /etc/rsyslog.conf FILE
===============================================================================

1. INTRODUCTION & OVERVIEW
-------------------------------------------------------------------------------
The `/etc/rsyslog.conf` file is the main configuration file for `rsyslogd`, 
an enhanced, high-performance system logging daemon used across Linux 
distributions (such as RHEL, CentOS, Debian, Ubuntu, and Fedora).

It defines how system log messages are collected, filtered, formatted, and 
routed to local files, remote logging servers, databases, or administrative 
consoles.


2. FILE LOCATION & OVERRIDE DIRECTORY
-------------------------------------------------------------------------------
* Main Configuration File: /etc/rsyslog.conf
* Configuration Drop-in Directory: /etc/rsyslog.d/*.conf
* Owner: root:root
* Permissions: 644 (-rw-r--r--)

Note: Custom logging rules and modular configurations should preferably be 
placed inside `/etc/rsyslog.d/` rather than modifying `/etc/rsyslog.conf` 
directly.


3. STRUCTURE & SYNTAX FORMATS
-------------------------------------------------------------------------------
`rsyslog` supports three syntax formats:
1. Basic / Sysklogd (Legacy Format):
   Selector based format (`facility.priority action`).
2. RainerScript (Recommended / Modern Format):
   Block-based, structured syntax with advanced conditional handling.
3. Property-Based Filters:
   Starts with `%` to filter logs based on message properties.

A. Legacy Format Example:
   authpriv.*               /var/log/secure
   cron.*                   /var/log/cron
   *.emerg                  :omusrmsg:*

B. Modern RainerScript Example:
   if $programname == 'sshd' then {
       action(type="omfile" file="/var/log/sshd.log")
       stop
   }


4. KEY CONFIGURATION SECTIONS
-------------------------------------------------------------------------------
A. Modules (`$ModLoad` or `module(...)`)
   Loads input/output plugins for specific features (e.g., listening on network 
   ports, writing to databases, or systemd journal integration).
   Example:
     module(load="imuxsock") # Local system logging
     module(load="imjournal") # Systemd journal access

B. Global Directives
   Configures daemon-wide settings such as default file creation modes.
   Example:
     global(workDirectory="/var/lib/rsyslog")

C. Rules / Action Directives
   Defines routing policies for incoming log events based on facility and severity.


5. COMMON FACILITIES AND SEVERITIES
-------------------------------------------------------------------------------
Facilities (Log Sources):
  auth, authpriv, cron, daemon, kern, lpr, mail, news, syslog, user, local0..local7

Severities (Log Levels):
  0: emerg (Emergency)    4: warning (Warning)
  1: alert (Alert)        5: notice (Notice)
  2: crit (Critical)      6: info (Informational)
  3: err (Error)          7: debug (Debug)


6. USEFUL COMMANDS & OPERATIONS
-------------------------------------------------------------------------------
A. Test Configuration Syntax:
   rsyslogd -N1

B. Restart the Logging Daemon:
   sudo systemctl restart rsyslog

C. Forward Logs to a Remote Syslog Server:
   UDP Forwarding:  *.* @192.168.1.50:514
   TCP Forwarding:  *.* @@192.168.1.50:514


7. BEST PRACTICES
-------------------------------------------------------------------------------
1. Syntax Validation: Always test the configuration syntax (`rsyslogd -N1`) 
   before restarting the daemon.
2. Use Drop-in Directory: Store application-specific logging rules in 
   `/etc/rsyslog.d/50-default.conf` or custom `.conf` files.
3. Log Rotation Integration: Ensure custom log destination paths are configured 
   in `logrotate` (`/etc/logrotate.d/`) to prevent disk exhaustion.
