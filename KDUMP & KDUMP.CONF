================================================================================
KDUMP & KDUMP.CONF - COMPREHENSIVE ARCHITECTURE & CONFIGURATION
================================================================================

1. INTRODUCTION: WHAT IS KDUMP?
--------------------------------------------------------------------------------
kdump is an advanced kernel crash-dumping mechanism for Linux systems. 

When a critical error occurs in the operating system—known as a Kernel Panic—
the system reaches an unrecoverable state. Instead of allowing the system to 
freeze or immediately reboot without diagnostic output, kdump captures a complete 
snapshot of the physical RAM (known as a `vmcore` file) for post-mortem analysis.

Key Terminology:
  - Kernel Panic : A fatal event where the kernel stops execution safely.
  - vmcore       : The raw memory image dump created during a crash.
  - crashkernel  : Reserved section of RAM allocated exclusively for kdump.
  - kexec        : Fast boot mechanism that loads a new kernel directly from RAM.


2. UNDERSTANDING KDUMP ARCHITECTURE
--------------------------------------------------------------------------------
kdump relies on a dual-kernel architecture to ensure safe crash dumping:

  [ Production Kernel (Primary System) ]
                 |
        (Kernel Panic Triggered)
                 |
                 v
  [ kexec System Call Jump ]
                 |
                 v
  [ Crash Capture Kernel (Isolated RAM) ]  ---> Writes /proc/vmcore to Target
                 |
        (Reboot System)

How it Works (Step-by-Step):
  1. Boot Time    : The primary kernel reserves a small slice of RAM 
                    (configured via the `crashkernel` parameter in GRUB).
  2. Crash Event  : If the primary kernel panics, it invokes `kexec`.
  3. Capture Boot : `kexec` boots a secondary, isolated "capture kernel" inside 
                    the reserved memory without going through BIOS/UEFI firmware.
  4. Core Dump    : The capture kernel reads `/proc/vmcore` (the crashed kernel's
                    memory state) and saves it according to `/etc/kdump.conf`.
  5. Recovery     : Once saved, the capture kernel reboots the system back into
                    the primary kernel.


3. THE CONFIGURATION FILE: /etc/kdump.conf
--------------------------------------------------------------------------------
The `/etc/kdump.conf` file instructs the capture kernel how and where to store
the `vmcore` file and what actions to execute.

A. DUMP DESTINATIONS (Choose One Primary Target)
------------------------------------------------
1. Local Filesystem (Default):
     path /var/crash
     * Saves dumps under `/var/crash/<timestamp>/vmcore`.

2. Network Target via NFS:
     nfs nfs-server.example.com:/export/cores
     path /var/crash

3. Network Target via SSH:
     ssh user@backup-server.example.com
     path /var/crash
     sshkey /root/.ssh/kdump_id_rsa

4. Raw Block Device:
     raw /dev/sdb2

B. CORE COLLECTOR & DUMP FILTERING
------------------------------------------------
Full memory dumps on machines with large RAM can take up hundreds of gigabytes. 
The `core_collector` tool (`makedumpfile`) compresses and filters memory pages.

Syntax:
  core_collector makedumpfile -l --message-level 7 -d 31

Flags Explained:
  -l        : Compresses data using zlib format.
  -c        : Compresses data using snappy format (faster compression).
  --message-level 7 : Controls verbose output logging (7 is maximum verbosity).
  -d <level>: Dump level bitmask used to exclude unneeded memory pages.

Dump Level (-d) Bitmask Values:
  +----+----------------------------------+
  | Bit| Page Type Excluded               |
  +----+----------------------------------+
  |  1 | Zero Pages (empty memory)        |
  |  2 | Cache Pages                      |
  |  4 | Cache Private Pages              |
  |  8 | User Process Data                |
  | 16 | Free Pages                       |
  +----+----------------------------------+
  * Level `-d 31` (1+2+4+8+16) excludes all 5 page types, leaving only core 
    kernel data. This produces the smallest possible vmcore file.

C. FAILURE HANDLING & EVENT ACTIONS
------------------------------------------------
If kdump fails to write the crash file to the configured target:
  failure_action reboot     : Reboots the server immediately (Default).
  failure_action halt       : Halts the system.
  failure_action poweroff   : Turns off the system.
  failure_action shell      : Drops into an interactive emergency shell.

Post-Dump Hooks:
  kdump_pre /usr/local/bin/pre-dump-script.sh  : Runs prior to dumping.
  kdump_post /usr/local/bin/post-dump-script.sh: Runs after dumping succeeds.


4. STEP-BY-STEP WORKFLOW: SETUP, VERIFY & TEST
--------------------------------------------------------------------------------
Step 1: Install kdump Utilities
  # RHEL / AlmaLinux / Rocky Linux
  sudo dnf install kexec-tools crash -y

  # Ubuntu / Debian
  sudo apt install kdump-tools crash -y

Step 2: Allocate Reserved Memory (GRUB)
  Verify memory reservation in kernel parameters:
    cat /proc/cmdline | grep crashkernel

  (Example parameter: `crashkernel=1G-4G:192M,4G-64G:256M,64G-:512M`)

Step 3: Enable & Start kdump Service
  sudo systemctl enable --now kdump

Step 4: Verify Capture Kernel Status
  cat /sys/kernel/kexec_crash_loaded
  * A value of `1` confirms the crash kernel is successfully loaded into RAM.

Step 5: Test Crash Dump Generation (WARNING: CAUSES SYSTEM CRASH)
  Only run this command on a test/non-production system!
    echo 1 > /proc/sys/kernel/sysrq
    echo c > /proc/sysrq-trigger

Step 6: Inspect & Analyze the Dump
  After rebooting, check for the newly generated vmcore file:
    ls -lh /var/crash/

  Analyze the core file using the `crash` interactive debugger:
    crash /usr/lib/debug/lib/modules/$(uname -r)/vmlinux /var/crash/<timestamp>/vmcore

  Useful Interactive Commands inside `crash`:
    bt        : Display backtrace of the crashing thread.
    sys       : Display system summary (kernel version, uptime, architecture).
    ps        : List process status at the time of the crash.
    log       : Display kernel ring buffer messages (dmesg output).
    quit      : Exit crash utility.
