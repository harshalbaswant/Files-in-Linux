===============================================================================
              /etc/host.conf FILE
===============================================================================

1. INTRODUCTION
-------------------------------------------------------------------------------
The `/etc/host.conf` file is a core network resolution configuration file 
used by the GNU C Library (glibc) resolver routines on Unix-like operating 
systems (such as Linux). 

When a program requests a hostname resolution (e.g., converting 'example.com' 
into an IP address), the glibc resolver reads `/etc/host.conf` to determine 
the behavior, sequence, and security options for local name lookups.


2. FILE STRUCTURE AND SYNTAX
-------------------------------------------------------------------------------
The file contains directive keywords followed by their corresponding options. 
Blank lines are ignored, and lines starting with `#` are treated as comments.

Common Directives:

   1. order
      - Syntax: `order service1, service2, ...`
      - Purpose: Specifies the sequence in which resolution methods are checked.
      - Supported services:
          * `hosts` : Consult the local `/etc/hosts` file.
          * `bind`  : Query a Domain Name System (DNS) server.
          * `nis`   : Query Network Information Service (if applicable).
      - Example: `order hosts, bind` (Checks local /etc/hosts first, then DNS).

   2. multi
      - Syntax: `multi on` or `multi off`
      - Purpose: Controls whether a host defined in `/etc/hosts` can return 
        multiple IP addresses.
      - Default: `off` (Returns only the first matching address).
      - Recommended: `on` (Allows returning all matching IP addresses).

   3. nospoof
     - - Syntax: `nospoof on` or `nospoof off`
      - Purpose: Security feature against hostname spoofing. When enabled, 
        the resolver performs a reverse lookup on IP addresses to verify 
        that the hostname matches.
      - Default: `off`

   4. spoofalert
      - Syntax: `spoofalert on` or `spoofalert off`
      - Purpose: If `nospoof` is active, setting `spoofalert on` logs any 
        spoofing attempts to syslog.

   5. reorder
      - Syntax: `reorder on` or `reorder off`
      - Purpose: Reorders IP addresses so that addresses on the local subnet 
        are listed first when multiple IP addresses are returned.


3. TYPICAL EXAMPLE OF AN /etc/host.conf FILE
-------------------------------------------------------------------------------
```text
# Configuration file for glibc resolver
# Search local hosts file first, then use DNS
order hosts, bind

# Allow hosts in /etc/hosts to have multiple IP addresses
multi on

# Enable spoof protection and logging
nospoof on
spoofalert on
```


4. /etc/host.conf VS /etc/nsswitch.conf
-------------------------------------------------------------------------------
Modern Linux distributions use `/etc/nsswitch.conf` (Name Service Switch) to 
manage system lookup order for hostnames, user databases, and group settings.

  * `/etc/host.conf` specifically configures legacy glibc resolver behavior.
  * `/etc/nsswitch.conf` takes precedence in modern environments. The line 
    `hosts: files dns` in `nsswitch.conf` performs the same job as 
    `order hosts, bind` in `host.conf`.

However, `/etc/host.conf` is still maintained for backwards compatibility 
and specific resolver options like `multi` and `nospoof`.
